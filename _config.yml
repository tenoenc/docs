# Configurations
title:            Teno's Library
longtitle:        Teno's Library
author:           Teno
email:            tenoenc@gmail.com
description: >
  

version:          1.0
gitbook_version:  3.2.3

url:              'https://tenoenc.github.io'
baseurl:          '/docs'
rss:              RSS

# bootstrap: use the remote theme for the site itself
remote_theme: sighingnow/jekyll-gitbook

toc:
  enabled: true
  h_min:   1
  h_max:   3

# customize the link favicon in header, will be {{site.baseurl}}/{{site.favicon_path}}
favicon_path:     /assets/gitbook/images/favicon.ico

# markdown render engine.
markdown:         kramdown
kramdown:
  auto_ids:               true
  input:                  GFM
  math_engine:            mathjax
  smart_quotes:           lsquo,rsquo,ldquo,rdquo
  toc_levels:             1..6
  syntax_highlighter:     rouge
  syntax_highlighter_opts:
    guess_lang:           true

syntax_highlighter_style: colorful

markdown_ext:             markdown,mkdown,mkdn,mkd,md

# Permalinks
permalink:                /:categories/:year-:month-:day-:title:output_ext

# Disqus comments
# disqushandler:            sighingnow

exclude:
  - _drafts

collections:
  kotlin:
    output: true
    permalink: /:collection/:path/
  mysql:
    output: true
    permalink: /:collection/:path/
  os:
    output: true
    permalink: /:collection/:path/
  java:
    output: true
    permalink: /:collection/:path/
  network:
    output: true
    permalink: /:collection/:path/
  docker:
    output: true
    permalink: /:collection/:path/
  datastructure:
    output: true
    permalink: /:collection/:path/
  algorithm:
    output: true
    permalink: /:collection/:path

ordered_collections:
  - posts
  - os
  - network
  - datastructure
  - algorithm
  - java
  - kotlin
  - mysql
  - docker

page_width: 800px

destination:      ./_site
incremental:      false
regenerate:       true

plugins:
  - jekyll-feed
  - jekyll-readme-index
  - jemoji
